version: '3.8'

services:
  # API Node.js (backend)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile       # se o nome for diferente, especifique aqui
    ports:
      - "5000:5000"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: clinica
      DB_PASSWORD: 1234
      DB_NAME: clinica
      NODE_ENV: production
    depends_on:
      - db

  # App React compilado e servido pelo Nginx
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile       # aponte pro seu Dockerfile do React+Nginx
    ports:
      - "3000:80"
    depends_on:
      - backend

  # Mobile Expo (React Native) — dev only
  mobile:
    build:
      context: ./mobile
      dockerfile: Dockerfile       # seu Dockerfile do Expo
    ports:
      - "19000:19000"
      - "19001:19001"
      - "19002:19002"
    environment:
      EXPO_DEVTOOLS_LISTEN_ADDRESS: 0.0.0.0
    stdin_open: true
    tty: true
    depends_on:
      - backend

  # Banco de dados MySQL
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 1234
      MYSQL_DATABASE: clinica
      MYSQL_USER: clinica
      MYSQL_PASSWORD: 1234
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"

  # phpMyAdmin
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    restart: always
    depends_on:
      - db
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: 1234
    ports:
      - "8080:80"

volumes:
  mysql_data:
